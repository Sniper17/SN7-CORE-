<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SN7 Core • Player</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{display:grid;place-items:center}.wrap{width:100%;height:100%;display:grid;place-items:center;padding:18px}.card{width:min(760px,100%);min-height:170px;padding:22px;border:1px solid rgba(255,255,255,.10);border-radius:20px;background:linear-gradient(145deg,rgba(13,17,24,.96),rgba(8,10,15,.94));box-shadow:0 18px 60px rgba(0,0,0,.28);backdrop-filter:blur(8px)}.top{display:flex;align-items:center;gap:14px}.art{width:58px;height:58px;flex:0 0 58px;border-radius:16px;display:grid;place-items:center;background:#171d28;border:1px solid rgba(255,255,255,.08);font-size:25px}.meta{min-width:0;flex:1}.kicker{display:block;color:#6ee7a8;font-size:10px;font-weight:800;letter-spacing:1.4px;margin-bottom:5px}.title{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{margin-top:3px;color:#9ba5b5;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{color:#9ba5b5;font-size:11px;text-align:right;white-space:nowrap}.progress{height:4px;background:#232a36;border-radius:99px;overflow:hidden;margin:18px 0 9px}.bar{height:100%;width:0;background:#5ee391;border-radius:inherit;transition:width .2s linear}.times{display:flex;justify-content:space-between;color:#6f798a;font-size:10px}.hidden-media{position:absolute;width:1px;height:1px;opacity:.001;pointer-events:none;left:-10000px;top:-10000px}.empty{color:#aab3c1;text-align:center;padding:25px 5px}.error{color:#ffb2b9;text-align:center;padding:25px 5px}.queue{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);display:grid;gap:7px}.queue-row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;font-size:11px;color:#aeb6c5}.queue-row strong{color:#e8ecf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-row small{color:#697386}.queue-row .num{color:#667083;text-align:center}.unsupported{color:#f2c98b}.invalid{width:min(560px,100%);padding:25px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:#0c1017;text-align:center}.invalid h1{font-size:20px;margin:0 0 8px}.invalid p{margin:0;color:#8e98a8;font-size:12px}@media(max-width:560px){.card{padding:17px;border-radius:16px}.title{font-size:16px}.status{display:none}.art{width:50px;height:50px;flex-basis:50px}}
</style>
</head>
<body>
{% if invalid %}
<div class="wrap"><div class="invalid"><h1>Conexão OBS inválida</h1><p>Gere uma nova conexão no perfil do SN7 Core.</p></div></div>
{% else %}
<div class="wrap"><div class="card" id="playerCard">
  <div class="top">
    <div class="art" id="art">♫</div>
    <div class="meta"><span class="kicker" id="kicker">SN7 CORE • PLAYER</span><div class="title" id="title">Aguardando música</div><div class="artist" id="artist">A fila está pronta.</div></div>
    <div class="status" id="status">AGUARDANDO</div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
  <div class="queue" id="queue"></div>
</div></div>
<div id="youtube" class="hidden-media"></div>
<audio id="audio" class="hidden-media" preload="auto" playsinline></audio>
<script>
(() => {
  "use strict";
  const TOKEN = {{ token|tojson }};
  const state = {
    currentId:null, provider:null, playing:false, volume:80,
    lastSnapshot:null, ytReady:false, yt:null, ytVideoId:null,
    spotifyReady:false, spotifyPlayer:null, spotifyDeviceId:null,
    spotifyState:null, spotifyInitPromise:null, spotifyToken:null,
    audio:null, audioUrl:null, lastEndedId:null, loadError:false,
    lastSeekRevision:0, progressBusy:false, lastProgressSent:0, loadingCurrent:false
  };
  const $ = id => document.getElementById(id);
  const fmt = value => {
    const s=Math.max(0,Math.floor(Number(value)||0));
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  };
  const esc = value => String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));

  function renderQueue(items){
    const box=$("queue"); if(!box)return;
    const list=Array.isArray(items)?items.slice(0,5):[];
    box.innerHTML=list.length
      ?list.map((x,i)=>`<div class="queue-row"><span class="num">${i+1}</span><strong>${esc(x.title||"Música")}</strong><small>${esc(x.artist||x.provider||"")}</small></div>`).join("")
      :"";
  }

  function render(snapshot){
    state.lastSnapshot=snapshot;
    const remoteVolume=Number(snapshot.state?.volume ?? 80);
    const volumeChanged=remoteVolume!==state.volume;
    state.volume=remoteVolume;
    const current=snapshot.current;
    const playing=!!snapshot.state?.is_playing;
    state.lastSeekRevision=Number(snapshot.state?.seek_revision ?? 0);

    $("title").textContent=current?.title||"Aguardando música";
    $("artist").textContent=current?.artist||"A fila está pronta.";
    $("status").textContent=current?(playing?"TOCANDO":"PAUSADO"):"AGUARDANDO";
    $("kicker").textContent=current?`SN7 CORE • ${String(current.provider||"link").toUpperCase()}`:"SN7 CORE • PLAYER";
    renderQueue(snapshot.queue);

    if(!current){
      stopMedia();
      $("bar").style.width="0%";
      $("elapsed").textContent="0:00";
      $("duration").textContent="0:00";
      return;
    }

    if(current.id!==state.currentId || current.source_url!==state.audioUrl ||
       current.provider!==state.provider || state.loadError){
      if(!state.loadingCurrent){
        state.loadingCurrent=true;
        loadCurrent(current,state.volume,playing)
          .catch(showError)
          .finally(()=>{state.loadingCurrent=false;});
      }
    }else{
      if(volumeChanged) syncVolume(state.volume);
      if(state.playing!==playing){
        state.playing=playing;
        syncPlaying(playing).catch(()=>{});
      }
      applySeekIfNeeded(snapshot).catch(()=>{});
      const p=Number(snapshot.state?.position_ms||0);
      const d=Number(snapshot.state?.duration_ms||0);
      if(d){
        $("bar").style.width=`${Math.min(100,p/d*100)}%`;
        $("elapsed").textContent=fmt(p/1000);
        $("duration").textContent=fmt(d/1000);
      }
    }
  }

  function showError(error){
    state.loadError=true;
    console.warn("[SN7 PLAYER]",error);
    $("status").textContent="ERRO";
    $("artist").textContent=error?.message||"Não foi possível reproduzir esta fonte.";
  }

  function stopMedia(){
    if(state.yt){try{state.yt.stopVideo()}catch(_){}}
    if(state.spotifyPlayer){try{state.spotifyPlayer.pause()}catch(_){}}
    if(state.audio){try{state.audio.pause();state.audio.removeAttribute("src");state.audio.load()}catch(_){}}
    state.currentId=null; state.provider=null; state.audioUrl=null; state.loadError=false;
    state.playing=false; state.lastSeekRevision=0;
  }

  function getYouTubeId(url){
    try{
      const u=new URL(url),h=u.hostname.toLowerCase();
      if(h.includes("youtu.be"))return u.pathname.split("/").filter(Boolean)[0]||null;
      if(h.includes("youtube.com")){
        if(u.pathname==="/watch")return u.searchParams.get("v");
        if(u.pathname.startsWith("/shorts/"))return u.pathname.split("/")[2]||null;
        if(u.pathname.startsWith("/embed/"))return u.pathname.split("/")[2]||null;
      }
    }catch(_){}
    return null;
  }

  function getSpotifyTrackId(url){
    const value=String(url||"").trim();
    if(value.startsWith("spotify:track:")){
      const id=value.slice(14).split("?")[0].trim();
      return /^[A-Za-z0-9]{22}$/.test(id)?id:null;
    }
    try{
      const u=new URL(value);
      if(["open.spotify.com","play.spotify.com"].includes(u.hostname.toLowerCase())){
        const parts=u.pathname.split("/").filter(Boolean);
        if(parts[0]?.toLowerCase()==="track" && /^[A-Za-z0-9]{22}$/.test(parts[1]||""))return parts[1];
      }
    }catch(_){}
    return null;
  }

  async function fetchSpotifyToken(){
    const r=await fetch(`/spotify-token/${encodeURIComponent(TOKEN)}`,{cache:"no-store"});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok||!d.access_token)throw new Error(d.error||"Não foi possível obter o acesso ao Spotify.");
    return d.access_token;
  }

  function syncSpotifyVolume(volume){
    if(state.spotifyPlayer){
      try{state.spotifyPlayer.setVolume(Math.max(0,Math.min(1,Number(volume)/100)));}catch(_){}
    }
  }
  function syncVolume(volume){
    state.volume=Math.max(0,Math.min(100,Number(volume)||0));
    syncSpotifyVolume(state.volume);
    if(state.yt){try{state.yt.setVolume(state.volume)}catch(_){}}
    if(state.audio)state.audio.volume=state.volume/100;
  }

  function spotifyApiPlay(trackId){
    if(!state.spotifyDeviceId)throw new Error("Dispositivo Spotify do OBS ainda não está pronto.");
    return fetch("https://api.spotify.com/v1/me/player/play?device_id="+encodeURIComponent(state.spotifyDeviceId),{
      method:"PUT",
      headers:{Authorization:`Bearer ${state.spotifyToken}`,"Content-Type":"application/json"},
      body:JSON.stringify({uris:[`spotify:track:${trackId}`]})
    }).then(async r=>{
      if(r.status===204)return;
      const d=await r.json().catch(()=>({}));
      throw new Error(d.error?.message||"O Spotify recusou a reprodução.");
    });
  }

  function ensureSpotifySdk(){
    if(window.Spotify?.Player)return Promise.resolve();
    if(state.spotifySdkPromise)return state.spotifySdkPromise;
    state.spotifySdkPromise=new Promise((resolve,reject)=>{
      const started=Date.now();
      let settled=false;
      const finish=(err)=>{
        if(settled)return;
        settled=true;
        if(err){state.spotifySdkPromise=null;reject(err);}else resolve();
      };
      const previous=window.onSpotifyWebPlaybackSDKReady;
      window.onSpotifyWebPlaybackSDKReady=()=>{
        try{if(typeof previous==="function")previous()}catch(_){}
        finish();
      };
      let script=document.querySelector('script[data-sn7-spotify-sdk]');
      if(!script){
        script=document.createElement("script");
        script.src="https://sdk.scdn.co/spotify-player.js";
        script.async=true;
        script.dataset.sn7SpotifySdk="1";
        script.onerror=()=>finish(new Error("Não foi possível carregar o Spotify Web Playback SDK no OBS."));
        document.head.appendChild(script);
      }
      const poll=()=>{
        if(settled)return;
        if(window.Spotify?.Player){finish();return;}
        if(Date.now()-started>=15000){finish(new Error("Spotify SDK não carregou no OBS."));return;}
        setTimeout(poll,100);
      };
      poll();
    });
    return state.spotifySdkPromise;
  }

  async function ensureSpotifyPlayer(){
    if(state.spotifyReady&&state.spotifyPlayer&&state.spotifyDeviceId)return;
    if(state.spotifyInitPromise)return state.spotifyInitPromise;
    state.spotifyInitPromise=(async()=>{
      await ensureSpotifySdk();
      state.spotifyToken=await fetchSpotifyToken();
      state.spotifyPlayer=new Spotify.Player({
        name:"SN7 Core OBS",
        getOAuthToken:cb=>fetchSpotifyToken().then(t=>{state.spotifyToken=t;cb(t)}).catch(()=>cb(state.spotifyToken)),
        volume:Math.max(0,Math.min(1,state.volume/100))
      });
      state.spotifyPlayer.addListener("ready",({device_id})=>{
        state.spotifyDeviceId=device_id;
        state.spotifyReady=true;
        syncSpotifyVolume(state.volume);
        const current=state.lastSnapshot?.current;
        if(current?.provider==="spotify"&&state.lastSnapshot?.state?.is_playing){
          const id=getSpotifyTrackId(current.source_url);
          if(id)spotifyApiPlay(id).catch(showError);
        }
      });
      state.spotifyPlayer.addListener("not_ready",({device_id})=>{
        if(device_id===state.spotifyDeviceId){state.spotifyReady=false;state.spotifyDeviceId=null;}
      });
      state.spotifyPlayer.addListener("authentication_error",({message})=>showError(new Error("Spotify: "+message)));
      state.spotifyPlayer.addListener("account_error",({message})=>showError(new Error("Spotify: "+(message||"Premium é necessário."))));
      state.spotifyPlayer.addListener("playback_error",({message})=>showError(new Error("Spotify: "+message)));
      state.spotifyPlayer.addListener("autoplay_failed",()=>showError(new Error("O navegador do OBS bloqueou o autoplay do Spotify.")));
      state.spotifyPlayer.addListener("player_state_changed",ps=>{
        state.spotifyState=ps;
        if(!ps)return;
        const track=ps.track_window?.current_track;
        const ended=track&&Number(ps.position||0)>=Math.max(0,Number(track.duration_ms||0)-1200)&&!ps.paused;
        if(ended){finishCurrent();return;}
        const duration=Number(track?.duration_ms||ps.duration||0);
        const position=Number(ps.position||0);
        updatePlaying(!ps.paused);
        renderProgress(position,duration);
        syncProgress(position,duration);
      });
      if(typeof state.spotifyPlayer.activateElement==="function"){
        try{await state.spotifyPlayer.activateElement();}catch(_){}
      }
      const connected=await state.spotifyPlayer.connect();
      if(!connected)throw new Error("Não foi possível conectar o player Spotify ao OBS.");
    })();
    try{await state.spotifyInitPromise}finally{state.spotifyInitPromise=null}
  }

  async function loadSpotify(trackId,playing){
    await ensureSpotifyPlayer();
    state.spotifyToken=await fetchSpotifyToken();
    syncSpotifyVolume(state.volume);
    if(playing)await spotifyApiPlay(trackId);
  }

  function loadYouTube(id,playing){
    if(!window.YT||!window.YT.Player)throw new Error("YouTube ainda está carregando. Aguarde um instante.");
    if(!state.yt){
      state.yt=new YT.Player("youtube",{
        width:"1",height:"1",videoId:id,
        playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,playsinline:1,rel:0},
        events:{
          onReady:e=>{
            state.ytReady=true;
            e.target.setVolume(state.volume);
            if(state.lastSnapshot?.state?.is_playing)e.target.playVideo();
          },
          onStateChange:e=>{
            if(e.data===0)finishCurrent();
            if(e.data===1)updatePlaying(true);
            if(e.data===2)updatePlaying(false);
          }
        }
      });
    }else{
      state.yt.loadVideoById(id);
      if(playing)state.yt.playVideo();
    }
  }

  async function loadAudio(url,playing,volume){
    if(!state.audio)state.audio=$("audio");
    state.audio.volume=Math.max(0,Math.min(1,Number(volume)/100));
    if(state.audio.src!==url){state.audio.src=url;state.audio.load();}
    if(playing){
      try{await state.audio.play();}
      catch(_){throw new Error("O OBS bloqueou a reprodução automática do áudio.");}
    }
  }

  async function loadCurrent(current,volume,playing){
    const url=current.source_url||"";
    stopOtherMedia(current.provider);
    if(current.provider==="youtube"){
      const id=getYouTubeId(url); if(!id)throw new Error("Link do YouTube inválido.");
      loadYouTube(id,playing);
    }else if(current.provider==="spotify"){
      const id=getSpotifyTrackId(url); if(!id)throw new Error("Faixa do Spotify inválida.");
      await loadSpotify(id,playing);
    }else if(current.provider==="link"){
      if(!/^https?:\/\//i.test(url)||!/\.(mp3|m4a|aac|ogg|wav|opus)(\?.*)?$/i.test(url))
        throw new Error("Link direto de áudio inválido.");
      await loadAudio(url,playing,volume);
    }else{
      throw new Error("Esta fonte não é compatível com o player do OBS. Use YouTube, Spotify ou link direto de áudio.");
    }
    state.currentId=current.id;
    state.provider=current.provider;
    state.audioUrl=url;
    state.playing=!!playing;
    state.lastEndedId=null;
    state.loadError=false;
    state.lastSeekRevision=Number(state.lastSnapshot?.state?.seek_revision||0);
    const p=Number(state.lastSnapshot?.state?.position_ms||0);
    const d=Number(state.lastSnapshot?.state?.duration_ms||0);
    if(d)renderProgress(p,d);
  }

  function stopOtherMedia(provider){
    if(provider!=="youtube"&&state.yt){try{state.yt.stopVideo()}catch(_){}}
    if(provider!=="spotify"&&state.spotifyPlayer){try{state.spotifyPlayer.pause()}catch(_){}}
    if(provider!=="link"&&state.audio){try{state.audio.pause()}catch(_){}}
  }

  async function syncPlaying(playing){
    if(state.provider==="youtube"&&state.yt){
      if(playing)state.yt.playVideo();else state.yt.pauseVideo();
    }
    if(state.provider==="spotify"&&state.spotifyPlayer){
      if(playing){
        if(state.spotifyState?.paused){try{await state.spotifyPlayer.resume()}catch(_){}}
        else if(!state.spotifyState){
          const id=getSpotifyTrackId(state.audioUrl);
          if(id)try{await spotifyApiPlay(id)}catch(_){}
        }
      }else{try{await state.spotifyPlayer.pause()}catch(_){}}
    }
    if(state.provider==="link"&&state.audio){
      if(playing&&!state.audio.src)await loadAudio(state.audioUrl,true,state.volume);
      else if(playing&&state.audio.paused){try{await state.audio.play()}catch(_){}}
      else if(!playing)state.audio.pause();
    }
  }

  function renderProgress(position,duration){
    const p=duration?Math.max(0,Math.min(100,position/duration*100)):0;
    $("bar").style.width=`${p}%`;
    $("elapsed").textContent=fmt(position/1000);
    $("duration").textContent=duration?fmt(duration/1000):"0:00";
  }

  async function updatePlaying(playing){
    state.playing=!!playing;
    try{
      await fetch(`/control/${encodeURIComponent(TOKEN)}/playing`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({is_playing:!!playing}),cache:"no-store"
      });
    }catch(_){}
  }

  async function syncProgress(position,duration){
    const now=Date.now();
    if(state.progressBusy||now-state.lastProgressSent<900)return;
    state.progressBusy=true;
    state.lastProgressSent=now;
    try{
      await fetch(`/control/${encodeURIComponent(TOKEN)}/progress`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({position_ms:Math.max(0,Math.round(position||0)),duration_ms:Math.max(0,Math.round(duration||0))}),
        cache:"no-store"
      });
    }catch(_){}
    finally{state.progressBusy=false;}
  }

  async function applySeekIfNeeded(snapshot){
    const revision=Number(snapshot.state?.seek_revision||0);
    if(!revision||revision===state.lastSeekRevision)return;
    state.lastSeekRevision=revision;
    const position=Math.max(0,Number(snapshot.state?.seek_position_ms||0));
    try{
      if(state.provider==="spotify"&&state.spotifyPlayer)await state.spotifyPlayer.seek(position);
      else if(state.provider==="youtube"&&state.yt)state.yt.seekTo(position/1000,true);
      else if(state.provider==="link"&&state.audio)state.audio.currentTime=position/1000;
      renderProgress(position,Number(snapshot.state?.duration_ms||0));
      await syncProgress(position,Number(snapshot.state?.duration_ms||0));
    }catch(_){}
  }

  async function finishCurrent(){
    if(state.lastEndedId===state.currentId)return;
    state.lastEndedId=state.currentId;
    try{
      const r=await fetch(`/control/${encodeURIComponent(TOKEN)}/skip`,{method:"POST",cache:"no-store"});
      if(!r.ok)return;
      const d=await r.json().catch(()=>null);
      if(d?.ok)render(d);
    }catch(_){}
  }

  async function heartbeat(){
    try{
      await fetch(`/control/${encodeURIComponent(TOKEN)}/heartbeat`,{
        method:"POST",cache:"no-store",keepalive:true
      });
    }catch(_){}
  }

  async function poll(){
    const r=await fetch(`/status/${encodeURIComponent(TOKEN)}`,{cache:"no-store"});
    if(!r.ok)throw new Error("Conexão OBS inválida.");
    const d=await r.json();
    render(d);
  }

  state.audio=$("audio");
  if(state.audio){
    state.audio.addEventListener("timeupdate",()=>{
      const d=state.audio.duration||0,c=state.audio.currentTime||0;
      renderProgress(c*1000,d*1000); syncProgress(c*1000,d*1000);
    });
    state.audio.addEventListener("ended",finishCurrent);
    state.audio.addEventListener("play",()=>updatePlaying(true));
    state.audio.addEventListener("pause",()=>updatePlaying(false));
  }

  window.onYouTubeIframeAPIReady=()=>{state.ytReady=true;poll().catch(showError);};
  const spotifyScript=document.createElement("script");
  spotifyScript.src="https://sdk.scdn.co/spotify-player.js";spotifyScript.async=true;spotifyScript.dataset.sn7SpotifySdk="1";document.head.appendChild(spotifyScript);
  const ytScript=document.createElement("script");
  ytScript.src="https://www.youtube.com/iframe_api";ytScript.async=true;document.head.appendChild(ytScript);

  setInterval(()=>{
    if(state.yt&&state.provider==="youtube"){
      try{
        const d=Number(state.yt.getDuration())*1000||0,c=Number(state.yt.getCurrentTime())*1000||0;
        renderProgress(c,d);syncProgress(c,d);
        if(d>0&&c>=d-900)finishCurrent();
      }catch(_){}
    }
  },500);

  setInterval(()=>poll().catch(()=>{}),500);
  setInterval(()=>heartbeat(),2000);
  heartbeat();
  poll().catch(showError);
})();
</script>
{% endif %}
</body>
</html>
