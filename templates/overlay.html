<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SN7 Core • Overlay</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{display:grid;place-items:center}.wrap{width:100%;height:100%;display:grid;place-items:center;padding:18px}.card{width:min(760px,100%);min-height:170px;padding:22px;border:1px solid rgba(255,255,255,.10);border-radius:20px;background:linear-gradient(145deg,rgba(13,17,24,.96),rgba(8,10,15,.94));box-shadow:0 18px 60px rgba(0,0,0,.28);backdrop-filter:blur(8px)}.top{display:flex;align-items:center;gap:14px}.art{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#111 0 13%,#8b7cf6 14% 19%,#171b26 20% 48%,#080b11 49% 62%,#1b2230 63% 100%);border:1px solid rgba(255,255,255,.10);box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:25px;position:relative;overflow:hidden}.art::after{content:"";width:11px;height:11px;border-radius:50%;background:#c8c0ff;box-shadow:0 0 0 3px #0c1017,0 0 0 4px rgba(255,255,255,.14)}.art.is-playing{animation:sn7DiscSpin 3.8s linear infinite}@keyframes sn7DiscSpin{to{transform:rotate(360deg)}}.meta{min-width:0;flex:1}.kicker{display:block;color:#6ee7a8;font-size:10px;font-weight:800;letter-spacing:1.4px;margin-bottom:5px}.title{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{margin-top:3px;color:#9ba5b5;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{color:#9ba5b5;font-size:11px;text-align:right;white-space:nowrap}.progress{height:4px;background:#232a36;border-radius:99px;overflow:hidden;margin:18px 0 9px}.bar{height:100%;width:0;background:#5ee391;border-radius:inherit;transition:width .2s linear}.times{display:flex;justify-content:space-between;color:#6f798a;font-size:10px}.hidden-media{position:absolute;width:1px;height:1px;opacity:.001;pointer-events:none;left:-10000px;top:-10000px}.empty{color:#aab3c1;text-align:center;padding:25px 5px}.error{color:#ffb2b9;text-align:center;padding:25px 5px}.queue{display:none}.unsupported{color:#f2c98b}.invalid{width:min(560px,100%);padding:25px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:#0c1017;text-align:center}.invalid h1{font-size:20px;margin:0 0 8px}.invalid p{margin:0;color:#8e98a8;font-size:12px}@media(max-width:560px){.card{padding:17px;border-radius:16px}.title{font-size:16px}.status{display:none}.art{width:50px;height:50px;flex-basis:50px}}
.overlay-stage{position:relative;width:100%;height:100%;overflow:hidden}.overlay-widget{position:absolute;z-index:10;pointer-events:none}.store-alert-widget{display:none;align-items:center;gap:12px;padding:14px 18px;border:1px solid rgba(155,140,255,.42);border-radius:16px;background:rgba(12,15,22,.92);box-shadow:0 18px 55px rgba(0,0,0,.32);backdrop-filter:blur(8px);opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}.store-alert-widget.show{display:flex;opacity:1;transform:none}.store-alert-icon{width:44px;height:44px;overflow:hidden;border-radius:12px;display:grid;place-items:center;background:#171d28;font-size:22px;flex:0 0 44px}.store-alert-icon img{width:100%;height:100%;object-fit:cover;display:block}.store-alert-text strong{display:block;font-size:13px}.store-alert-text small{display:block;margin-top:4px;color:#9ba5b5;font-size:10px}.store-audio-status{display:none;align-items:center;gap:7px;padding:10px 14px;border-radius:12px;background:rgba(12,15,22,.88);border:1px solid rgba(255,255,255,.08);font-size:10px;color:#d9deea;box-shadow:0 12px 35px rgba(0,0,0,.24)}.store-audio-status.show{display:flex}.store-audio-custom-image{width:22px;height:22px;border-radius:6px;object-fit:cover}.studio-placeholder{display:none}.overlay-stage .card{position:absolute;margin:0;z-index:5;pointer-events:none;transform:none;transition:left .15s ease,top .15s ease,width .15s ease}.overlay-stage>.wrap{position:static;padding:0;width:100%;height:100%}@media(prefers-reduced-motion:reduce){.art.is-playing{animation:none}}

/* SN7 CORE · MINI GAMES CINEMATIC OVERLAY */
#sn7GameOverlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s ease}
#sn7GameOverlay.show{opacity:1;visibility:visible}
.sn7-game-vignette{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(20,24,34,.02),rgba(3,5,9,.48) 75%,rgba(0,0,0,.72));opacity:.9}
.sn7-game-card{position:relative;width:min(920px,92vw);min-height:300px;padding:34px 38px;border:1px solid rgba(255,255,255,.13);border-radius:28px;background:linear-gradient(145deg,rgba(17,21,29,.97),rgba(7,10,15,.97));box-shadow:0 35px 110px rgba(0,0,0,.58),0 0 80px rgba(155,140,255,.10),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.85,.25,1)}
#sn7GameOverlay.show .sn7-game-card{transform:none}
.sn7-game-card:before{content:"";position:absolute;inset:-35%;background:radial-gradient(circle at 50% 20%,rgba(155,140,255,.12),transparent 42%);pointer-events:none}
.sn7-game-kicker{position:relative;text-align:center;color:#a99cff;font-size:10px;font-weight:1000;letter-spacing:3px;text-transform:uppercase}
.sn7-game-title{position:relative;margin:8px 0 4px;text-align:center;font-size:clamp(24px,4vw,42px);font-weight:1000;letter-spacing:-1px}
.sn7-game-sub{position:relative;text-align:center;color:#8f98a8;font-size:12px;line-height:1.5}
.sn7-game-result{position:relative;margin:20px auto 0;max-width:800px;text-align:center;font-weight:900;font-size:clamp(13px,2vw,18px);color:#eef0f6;line-height:1.45}
.sn7-game-user{color:#c9c0ff}.sn7-win{color:#6ee7a8}.sn7-loss{color:#ff9da6}.sn7-gold{color:#ffd66b}
.sn7-slots{position:relative;display:flex;justify-content:center;gap:12px;margin:25px auto 8px;perspective:900px}
.sn7-reel{width:150px;height:170px;padding:10px;border-radius:22px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(180deg,#1c222e,#0b0e14);box-shadow:inset 0 2px 0 rgba(255,255,255,.05),0 15px 35px rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden}
.sn7-reel-inner{width:100%;height:100%;border-radius:15px;background:linear-gradient(180deg,#f7f8fb,#bfc5cf);display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.10),inset 0 -18px 35px rgba(0,0,0,.13)}
.sn7-symbol{font-size:76px;filter:drop-shadow(0 5px 2px rgba(0,0,0,.18));line-height:1}
.sn7-reel.spinning .sn7-symbol{animation:sn7ReelSpin .11s linear infinite;filter:blur(2px) drop-shadow(0 5px 2px rgba(0,0,0,.18))}
.sn7-reel.landed{animation:sn7Land .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes sn7ReelSpin{to{transform:translateY(16px) rotateX(18deg)}}
@keyframes sn7Land{0%{transform:scale(1.06)}100%{transform:scale(1)}}
.sn7-slot-lights{display:flex;justify-content:center;gap:8px;margin:8px 0}.sn7-slot-light{width:7px;height:7px;border-radius:50%;background:#6f7785;box-shadow:0 0 0 rgba(155,140,255,0)}.sn7-slot-light.on{background:#a99cff;box-shadow:0 0 14px rgba(155,140,255,.85);animation:sn7Blink .42s ease infinite alternate}@keyframes sn7Blink{to{opacity:.35}}
.sn7-coin{width:170px;height:170px;margin:26px auto 12px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff0a8,#e6aa2f 35%,#7c4d0c 72%,#2d1b05 100%);border:8px solid #6d4610;box-shadow:0 22px 55px rgba(0,0,0,.45),0 0 45px rgba(255,206,87,.25);font-size:74px}.sn7-coin.flip{animation:sn7CoinFlip 1.15s cubic-bezier(.25,.7,.25,1)}@keyframes sn7CoinFlip{0%{transform:rotateY(0) rotateZ(0)}45%{transform:rotateY(900deg) rotateZ(12deg) scale(1.08)}100%{transform:rotateY(1800deg) rotateZ(0) scale(1)}}
.sn7-bars{position:relative;margin:24px auto 5px;display:grid;gap:9px;max-width:720px}.sn7-bar-row{display:grid;grid-template-columns:minmax(110px,1fr) 3fr 55px;gap:10px;align-items:center;font-size:11px}.sn7-bar-track{height:13px;border-radius:99px;background:#1a202a;overflow:hidden;border:1px solid rgba(255,255,255,.05)}.sn7-bar-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#7564df,#b5abff);transition:width .7s cubic-bezier(.2,.8,.2,1)}.sn7-bar-count{text-align:right;color:#cbd1dc;font-weight:900}
.sn7-quiz-box{position:relative;margin:25px auto 0;max-width:760px;padding:22px;border:1px solid rgba(155,140,255,.18);border-radius:18px;background:rgba(10,13,19,.72);text-align:center}.sn7-quiz-question{font-size:clamp(16px,2.4vw,24px);font-weight:900;line-height:1.35}.sn7-answer-pop{margin-top:15px;font-size:13px;color:#8f98a8}.sn7-answer-pop.correct{color:#6ee7a8}.sn7-answer-pop.wrong{color:#ff9da6}
.sn7-race{position:relative;margin:25px auto 5px;max-width:820px;padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(180deg,#131923,#0b0f15);overflow:hidden}.sn7-track{position:relative;display:grid;gap:8px}.sn7-lane{height:30px;position:relative;border-bottom:1px dashed rgba(255,255,255,.08);background:repeating-linear-gradient(90deg,transparent 0 55px,rgba(255,255,255,.035) 55px 56px)}.sn7-car{position:absolute;left:0;top:1px;width:42px;height:26px;border-radius:7px 11px 6px 7px;background:linear-gradient(145deg,#e7ebf2,#7c8798);box-shadow:0 5px 12px rgba(0,0,0,.35);font-size:16px;display:grid;place-items:center;transition:left 1.5s cubic-bezier(.15,.75,.2,1)}.sn7-car:after{content:"";position:absolute;right:5px;bottom:-4px;width:7px;height:7px;border-radius:50%;background:#080a0e;box-shadow:-24px 0 #080a0e}.sn7-race-finish{position:absolute;right:10px;top:0;bottom:0;width:4px;background:repeating-linear-gradient(180deg,#fff 0 8px,#222 8px 16px);opacity:.65}.sn7-race-label{display:flex;justify-content:space-between;color:#8f98a8;font-size:9px;margin-top:8px}.sn7-podium{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px auto 0}.sn7-podium span{padding:9px 13px;border-radius:10px;background:#161c26;border:1px solid rgba(255,255,255,.07);font-size:11px;font-weight:900}
.sn7-survival-scene{position:relative;margin:25px auto 0;max-width:820px;height:250px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:radial-gradient(circle at 50% 35%,rgba(104,130,92,.22),transparent 35%),linear-gradient(180deg,#101a18,#07100d)}.sn7-moon{position:absolute;right:10%;top:13%;width:60px;height:60px;border-radius:50%;background:#d9e1c5;box-shadow:0 0 35px rgba(220,230,190,.28)}.sn7-trees{position:absolute;inset:auto 0 0;height:70%;background:linear-gradient(150deg,transparent 0 45%,#07100d 46% 100%);opacity:.9}.sn7-survivors{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 25px 28px;z-index:2}.sn7-person{width:54px;height:78px;border-radius:28px 28px 10px 10px;background:linear-gradient(180deg,#a7b1bd,#3b4654);display:grid;place-items:center;font-size:25px;box-shadow:0 10px 20px rgba(0,0,0,.3);transition:opacity .45s,transform .45s,filter .45s}.sn7-person.dead{opacity:.16;filter:grayscale(1);transform:translateY(20px) rotate(8deg)}.sn7-chapter{position:absolute;left:18px;top:16px;z-index:4;padding:7px 10px;border-radius:9px;background:rgba(5,8,10,.65);border:1px solid rgba(255,255,255,.08);font-size:9px;font-weight:1000;letter-spacing:1px}
.sn7-target{position:relative;width:220px;height:220px;margin:25px auto 8px;border-radius:50%;background:repeating-radial-gradient(circle,#151b25 0 19px,#0a0d13 20px 22px);border:2px solid #8f98a8;box-shadow:0 0 0 8px rgba(255,255,255,.025),0 20px 55px rgba(0,0,0,.4)}.sn7-cross{position:absolute;inset:0}.sn7-cross:before,.sn7-cross:after{content:"";position:absolute;background:#a99cff;box-shadow:0 0 15px rgba(169,156,255,.55)}.sn7-cross:before{width:2px;height:100%;left:50%}.sn7-cross:after{height:2px;width:100%;top:50%}.sn7-shot{position:absolute;width:18px;height:18px;border-radius:50%;background:#ff6e78;box-shadow:0 0 25px rgba(255,80,95,.8);left:50%;top:50%;transform:translate(-50%,-50%);animation:sn7Shot .6s ease}@keyframes sn7Shot{0%{transform:translate(-50%,-50%) scale(2);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.sn7-safe{position:relative;width:230px;height:170px;margin:25px auto 10px;border-radius:22px;border:9px solid #303744;background:linear-gradient(145deg,#596273,#1c222c);box-shadow:0 22px 50px rgba(0,0,0,.45);display:grid;place-items:center}.sn7-safe-wheel{width:105px;height:105px;border-radius:50%;border:10px solid #9da6b4;background:#262d38;display:grid;place-items:center;font-size:30px;animation:sn7SafeSpin 1.2s cubic-bezier(.2,.8,.2,1)}@keyframes sn7SafeSpin{to{transform:rotate(720deg)}}
.sn7-heist{position:relative;height:210px;max-width:780px;margin:25px auto 0;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#111722,#080b10);border:1px solid rgba(255,255,255,.08)}.sn7-heist-mask{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 9px);opacity:.45}.sn7-heist-icon{position:absolute;font-size:82px;left:50%;top:50%;transform:translate(-50%,-50%);animation:sn7Sneak 1.2s ease-in-out infinite alternate}@keyframes sn7Sneak{to{transform:translate(-42%,-50%) rotate(-2deg)}}
.sn7-jackpot{position:relative;margin:20px auto;width:260px;height:170px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#211a0b,#0c0d10);border:2px solid #8b6823;box-shadow:0 0 50px rgba(255,204,87,.17),0 25px 55px rgba(0,0,0,.45);font-size:78px}.sn7-jackpot.win{animation:sn7JackpotWin .8s ease-in-out infinite alternate}@keyframes sn7JackpotWin{to{transform:scale(1.04);box-shadow:0 0 90px rgba(255,204,87,.38),0 25px 55px rgba(0,0,0,.45)}}
.sn7-flash{animation:sn7Flash .42s ease}@keyframes sn7Flash{50%{filter:brightness(1.8)}}
@media(max-width:600px){.sn7-game-card{padding:24px 16px;min-height:260px;border-radius:22px}.sn7-reel{width:86px;height:112px;padding:7px}.sn7-symbol{font-size:50px}.sn7-slots{gap:7px}.sn7-coin{width:125px;height:125px;font-size:55px}.sn7-survival-scene{height:210px}.sn7-person{width:42px;height:62px;font-size:20px}.sn7-bar-row{grid-template-columns:90px 1fr 38px}.sn7-race{padding:9px}}
@media(prefers-reduced-motion:reduce){:is(#sn7GameOverlay *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
{% if invalid %}
<div class="wrap"><div class="invalid"><h1>Conexão OBS inválida</h1><p>Gere uma nova conexão no perfil do SN7 Core.</p></div></div>
{% else %}
<div class="overlay-stage" id="overlayStage"><div class="wrap"><div class="card" id="playerCard">
  <div class="top">
    <div class="art" id="art" aria-label="Disco da música atual"></div>
    <div class="meta"><span class="kicker" id="kicker">SN7 CORE • PLAYER</span><div class="title" id="title">Aguardando música</div><div class="artist" id="artist">A fila está pronta.</div></div>
    <div class="status" id="status">AGUARDANDO</div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
  <div class="queue" id="queue"></div>
</div></div>
  <div id="storeAlert" class="overlay-widget store-alert-widget"><div class="store-alert-icon" id="storeAlertIcon">🎁</div><div class="store-alert-text"><strong id="storeAlertTitle">Novo resgate</strong><small id="storeAlertSub">Aguardando…</small></div></div>
  <div id="storeAudioStatus" class="overlay-widget store-audio-status">🔊 Áudio da Loja</div>
</div>
<div id="sn7GameOverlay" aria-hidden="true"><div class="sn7-game-vignette"></div><div class="sn7-game-card" id="sn7GameCard"></div></div>
<div id="youtube" class="hidden-media"></div>
<audio id="audio" class="hidden-media" preload="auto" playsinline></audio>
<audio id="storeAudio" class="hidden-media" preload="auto" playsinline></audio>
<script>
(() => {
  "use strict";
  const TOKEN = {{ token|tojson }};
  const state = {
    currentId:null, provider:null, playing:false, volume:80,
    lastSnapshot:null, ytReady:false, yt:null, ytVideoId:null,
    spotifyReady:false, spotifyPlayer:null, spotifyDeviceId:null,
    spotifyState:null, spotifyInitPromise:null, spotifyToken:null,
    audio:null, audioUrl:null, lastEndedId:null, loadError:false,
    lastSeekRevision:0, progressBusy:false, lastProgressSent:0, loadingCurrent:false,
    clockPosition:0, clockDuration:0, clockAt:0, clockRunning:false, overlayConfig:null, lastOverlayEvent:0, storeAudio:null, storeAudioBusy:false
  };
  const $ = id => document.getElementById(id);
  state.overlayConfig={{ (overlay_config or {})|tojson }};
  applyOverlayLayout();
  window.addEventListener("resize",applyOverlayLayout);

  const fmt = value => {
    const s=Math.max(0,Math.floor(Number(value)||0));
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  };
  const esc = value => String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));


  function applyOverlayLayout(){
    const cfg=state.overlayConfig||{};
    const elements=Array.isArray(cfg.elements)?cfg.elements:[];
    const stage=$("overlayStage");
    if(!stage)return;
    const sw=stage.clientWidth||window.innerWidth||1920, sh=stage.clientHeight||window.innerHeight||1080;
    const byType={};
    elements.forEach(e=>{if(e?.type)byType[e.type]=e;});
    const music=byType.music;
    const card=$("playerCard");
    if(card&&music){
      card.style.left=((Number(music.x||0)/1920)*sw)+"px";
      card.style.top=((Number(music.y||0)/1080)*sh)+"px";
      card.style.width=Math.max(120,(Number(music.width||760)/1920)*sw)+"px";
      card.style.minHeight=Math.max(90,(Number(music.height||170)/1080)*sh)+"px";
      card.style.display=music.enabled===false?"none":"block";
    }
    const alert=byType.store_alert, aw=$("storeAlert");
    if(aw&&alert){aw.style.left=((Number(alert.x||0)/1920)*sw)+"px";aw.style.top=((Number(alert.y||0)/1080)*sh)+"px";aw.style.width=Math.max(120,(Number(alert.width||400)/1920)*sw)+"px";aw.style.minHeight=Math.max(42,(Number(alert.height||120)/1080)*sh)+"px";if(alert.enabled===false)aw.style.display="none";}
    const audio=byType.store_audio, as=$("storeAudioStatus");
    if(as&&audio){as.style.left=((Number(audio.x||0)/1920)*sw)+"px";as.style.top=((Number(audio.y||0)/1080)*sh)+"px";as.style.width=Math.max(120,(Number(audio.width||400)/1920)*sw)+"px";if(audio.enabled===false)as.style.display="none";}
  }

  function configuredElement(type){
    return (state.overlayConfig?.elements||[]).find(e=>e.type===type && e.enabled!==false);
  }

  function showStoreAlert(p){
    if(!configuredElement("store_alert"))return;
    const box=$("storeAlert");if(!box)return;
    const el=configuredElement("store_alert");
    const customImage=String(el?.settings?.image_url||"").trim();
    const itemImage=String(p.image_url||"").trim();
    const icon=$("storeAlertIcon");
    if(icon){
      if(itemImage||customImage){
        icon.innerHTML=`<img src="${esc(customImage||itemImage)}" alt="">`;
      }else{
        icon.textContent=p.item_type==="audio"?"🔊":"🎁";
      }
    }
    $("storeAlertTitle").textContent=String(p.item||"Nova recompensa");
    $("storeAlertSub").textContent=`${String(p.viewer||"Alguém")} • ${Number(p.price||0).toLocaleString("pt-BR")} pontos`;
    box.classList.add("show");
    clearTimeout(state.storeAlertTimer);
    state.storeAlertTimer=setTimeout(()=>box.classList.remove("show"),Math.max(2,Number(configuredElement("store_alert")?.settings?.duration||5))*1000);
  }

  async function playStoreAudio(p){
    if(!p.audio_url||!configuredElement("store_audio"))return;
    const audio=$("storeAudio");if(!audio)return;
    try{
      state.storeAudioBusy=true;
      const wasPlaying=state.playing, oldVolume=state.volume;
      const el=configuredElement("store_audio"), targetVolume=Math.max(0,Math.min(1,Number(el?.settings?.volume ?? 1)));
      if(wasPlaying)syncVolume(Math.max(1,Math.round(oldVolume*0.18)));
      audio.src=p.audio_url;audio.volume=targetVolume;audio.currentTime=0;
      const status=$("storeAudioStatus");
      const customImage=String(el?.settings?.image_url||"").trim();
      if(status){
        const itemImage=String(p.image_url||"").trim();
        status.innerHTML=(customImage||itemImage)?`<img class="store-audio-custom-image" src="${esc(customImage||itemImage)}" alt=""> <span>🔊 Áudio da Loja</span>`:"🔊 Áudio da Loja";
        status.classList.add("show");
      }
      await audio.play();
      await new Promise(resolve=>{audio.onended=resolve;audio.onerror=resolve;});
      $("storeAudioStatus").classList.remove("show");
      if(wasPlaying)syncVolume(oldVolume);
    }catch(err){console.warn("[SN7 OVERLAY AUDIO]",err);$("storeAudioStatus")?.classList.remove("show");}
    finally{state.storeAudioBusy=false;}
  }

  function handleOverlayEvent(ev){
    if(!ev||ev.id<=state.lastOverlayEvent)return;
    state.lastOverlayEvent=Math.max(state.lastOverlayEvent,Number(ev.id)||0);
    const p=ev.payload||{};

  function renderQueue(items){

  function setClock(position, duration, playing){
    state.clockPosition=Math.max(0,Number(position)||0);
    state.clockDuration=Math.max(0,Number(duration)||0);
    state.clockAt=performance.now();
    state.clockRunning=!!playing && state.clockDuration>0;
  }

  function tickClock(){
    if(!state.clockRunning || !state.clockDuration)return;
    const elapsed=Math.max(0,performance.now()-state.clockAt);
    const position=Math.min(state.clockDuration,state.clockPosition+elapsed);
    renderProgress(position,state.clockDuration);
    if(position>=state.clockDuration-900)finishCurrent();
  }

  function render(snapshot){
    state.lastSnapshot=snapshot;
    const remoteVolume=Number(snapshot.state?.volume ?? 80);
    const volumeChanged=remoteVolume!==state.volume;
    state.volume=remoteVolume;
    const current=snapshot.current;
    const playing=!!snapshot.state?.is_playing;
    const remoteSeekRevision=Number(snapshot.state?.seek_revision ?? 0);
    const seekChanged=remoteSeekRevision!==state.lastSeekRevision;

    $("title").textContent=current?.title||"Aguardando música";
    $("artist").textContent=current?.artist||"A fila está pronta.";
    $("status").textContent=current?(playing?"TOCANDO":"PAUSADO"):"AGUARDANDO";
    $("kicker").textContent=current?`SN7 CORE • ${String(current.provider||"link").toUpperCase()}`:"SN7 CORE • PLAYER";
    renderQueue([]);
    $("art")?.classList.toggle("is-playing", !!current && playing);

    if(!current){
      stopMedia();
      $("bar").style.width="0%";
      $("elapsed").textContent="0:00";
      $("duration").textContent="0:00";
      return;
    }

    if(current.id!==state.currentId || current.source_url!==state.audioUrl ||
       current.provider!==state.provider || state.loadError){
      if(!state.loadingCurrent){
        state.loadingCurrent=true;
        loadCurrent(current,state.volume,playing)
          .catch(showError)
          .finally(()=>{state.loadingCurrent=false;});
      }
    }else{
      if(volumeChanged) syncVolume(state.volume);
      if(state.playing!==playing){
        state.playing=playing;
        syncPlaying(playing).catch(()=>{});
      }
      const p=Number(snapshot.state?.position_ms||0);
      const d=Number(snapshot.state?.duration_ms||0);
      applySeekIfNeeded(snapshot).catch(()=>{});
      // O snapshot do PostgreSQL é usado como sincronização, não como relógio.
      // A barra avança localmente entre os snapshots para ficar realmente em
      // tempo real e não "pular" para trás a cada consulta do backend.
      if(!playing){
        setClock(p,d,false);
        renderProgress(p,d);
      }else if(seekChanged || !state.clockRunning || Math.abs(
        p-(state.clockPosition+Math.max(0,performance.now()-state.clockAt))
      )>2500){
        setClock(p,d,true);
        renderProgress(p,d);
      }else if(d && d!==state.clockDuration){
        setClock(Math.min(p,d),d,true);
      }
    }
  }

  function showError(error){
    state.loadError=true;
    console.warn("[SN7 PLAYER]",error);
    $("status").textContent="ERRO";
    $("artist").textContent=error?.message||"Não foi possível reproduzir esta fonte.";

  function stopMedia(){
    if(state.yt){try{state.yt.stopVideo()}catch(_){}}
    if(state.spotifyPlayer){try{state.spotifyPlayer.pause()}catch(_){}}
    if(state.audio){try{state.audio.pause();state.audio.removeAttribute("src");state.audio.load()}catch(_){}}
    state.currentId=null; state.provider=null; state.audioUrl=null; state.loadError=false;
    state.playing=false; state.lastSeekRevision=0; state.clockRunning=false;
    state.clockPosition=0; state.clockDuration=0; state.clockAt=0;
  }

  function getYouTubeId(url){
    try{
      const u=new URL(url),h=u.hostname.toLowerCase();
      if(h.includes("youtu.be"))return u.pathname.split("/").filter(Boolean)[0]||null;
      if(h.includes("youtube.com")){
        if(u.pathname==="/watch")return u.searchParams.get("v");
        if(u.pathname.startsWith("/shorts/"))return u.pathname.split("/")[2]||null;
        if(u.pathname.startsWith("/embed/"))return u.pathname.split("/")[2]||null;
      }
    }catch(_){}
    return null;
  }

  function getSpotifyTrackId(url){
    const value=String(url||"").trim();
    if(value.startsWith("spotify:track:")){
      const id=value.slice(14).split("?")[0].trim();
      return /^[A-Za-z0-9]{22}$/.test(id)?id:null;
    }
    try{
      const u=new URL(value);
      if(["open.spotify.com","play.spotify.com"].includes(u.hostname.toLowerCase())){
        const parts=u.pathname.split("/").filter(Boolean);
        if(parts[0]?.toLowerCase()==="track" && /^[A-Za-z0-9]{22}$/.test(parts[1]||""))return parts[1];
      }
    }catch(_){}
    return null;
  }

  async function fetchSpotifyToken(){
    const r=await fetch(`/spotify-token/${encodeURIComponent(TOKEN)}`,{cache:"no-store"});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok||!d.access_token)throw new Error(d.error||"Não foi possível obter o acesso ao Spotify.");
    return d.access_token;

  function syncSpotifyVolume(volume){

  function syncVolume(volume){
    state.volume=Math.max(0,Math.min(100,Number(volume)||0));
    syncSpotifyVolume(state.volume);
    if(state.yt){try{state.yt.setVolume(state.volume)}catch(_){}}
    if(state.audio)state.audio.volume=state.volume/100;

  function spotifyApiPlay(trackId){
    if(!state.spotifyDeviceId)throw new Error("Dispositivo Spotify do OBS ainda não está pronto.");
    return fetch("https://api.spotify.com/v1/me/player/play?device_id="+encodeURIComponent(state.spotifyDeviceId),{
      method:"PUT",
      headers:{Authorization:`Bearer ${state.spotifyToken}`,"Content-Type":"application/json"},
      body:JSON.stringify({uris:[`spotify:track:${trackId}`]})
    }).then(async r=>{
      if(r.status===204)return;
      const d=await r.json().catch(()=>({}));
      throw new Error(d.error?.message||"O Spotify recusou a reprodução.");
    });
  }

  function ensureSpotifySdk(){
    if(window.Spotify?.Player)return Promise.resolve();
    if(state.spotifySdkPromise)return state.spotifySdkPromise;
    state.spotifySdkPromise=new Promise((resolve,reject)=>{
      const started=Date.now();
      let settled=false;
      const finish=(err)=>{
        if(settled)return;
        settled=true;
        if(err){state.spotifySdkPromise=null;reject(err);}else resolve();
      };
      const previous=window.onSpotifyWebPlaybackSDKReady;
      window.onSpotifyWebPlaybackSDKReady=()=>{
        try{if(typeof previous==="function")previous()}catch(_){}
        finish();
      };
      let script=document.querySelector('script[data-sn7-spotify-sdk]');
      if(!script){
        script=document.createElement("script");
        script.src="https://sdk.scdn.co/spotify-player.js";
        script.async=true;
        script.dataset.sn7SpotifySdk="1";
        script.onerror=()=>finish(new Error("Não foi possível carregar o Spotify Web Playback SDK no OBS."));
        document.head.appendChild(script);
      }
      const poll=()=>{
        if(settled)return;
        if(window.Spotify?.Player){finish();return;}
        if(Date.now()-started>=15000){finish(new Error("Spotify SDK não carregou no OBS."));return;}
        setTimeout(poll,100);
      };
      poll();
    });
    return state.spotifySdkPromise;
  }

  async function ensureSpotifyPlayer(){
    if(state.spotifyReady&&state.spotifyPlayer&&state.spotifyDeviceId)return;
    if(state.spotifyInitPromise)return state.spotifyInitPromise;
    state.spotifyInitPromise=(async()=>{
      await ensureSpotifySdk();
      state.spotifyToken=await fetchSpotifyToken();
      state.spotifyPlayer=new Spotify.Player({
        name:"SN7 Core OBS",
        getOAuthToken:cb=>fetchSpotifyToken().then(t=>{state.spotifyToken=t;cb(t)}).catch(()=>cb(state.spotifyToken)),
        volume:Math.max(0,Math.min(1,state.volume/100))
      });
      state.spotifyPlayer.addListener("ready",({device_id})=>{
        state.spotifyDeviceId=device_id;
        state.spotifyReady=true;
        syncSpotifyVolume(state.volume);
        const current=state.lastSnapshot?.current;
        if(current?.provider==="spotify"&&state.lastSnapshot?.state?.is_playing){
          const id=getSpotifyTrackId(current.source_url);
          if(id)spotifyApiPlay(id).catch(showError);
        }
      });
      state.spotifyPlayer.addListener("not_ready",({device_id})=>{
        if(device_id===state.spotifyDeviceId){state.spotifyReady=false;state.spotifyDeviceId=null;}
      });
      state.spotifyPlayer.addListener("authentication_error",({message})=>showError(new Error("Spotify: "+message)));
      state.spotifyPlayer.addListener("account_error",({message})=>showError(new Error("Spotify: "+(message||"Premium é necessário."))));
      state.spotifyPlayer.addListener("playback_error",({message})=>showError(new Error("Spotify: "+message)));
      state.spotifyPlayer.addListener("autoplay_failed",()=>showError(new Error("O navegador do OBS bloqueou o autoplay do Spotify.")));
      state.spotifyPlayer.addListener("player_state_changed",ps=>{
        state.spotifyState=ps;
        if(!ps)return;
        const track=ps.track_window?.current_track;
        const ended=track&&Number(ps.position||0)>=Math.max(0,Number(track.duration_ms||0)-1200)&&!ps.paused;
        if(ended){finishCurrent();return;}
        const duration=Number(track?.duration_ms||ps.duration||0);
        const position=Number(ps.position||0);
        updatePlaying(!ps.paused);
        setClock(position,duration,!ps.paused);
        renderProgress(position,duration);
        syncProgress(position,duration);
      });
      if(typeof state.spotifyPlayer.activateElement==="function"){
        try{await state.spotifyPlayer.activateElement();}catch(_){}
      }
      const connected=await state.spotifyPlayer.connect();
      if(!connected)throw new Error("Não foi possível conectar o player Spotify ao OBS.");
    })();
    try{await state.spotifyInitPromise}finally{state.spotifyInitPromise=null}
  }

  async function loadSpotify(trackId,playing){
    await ensureSpotifyPlayer();
    state.spotifyToken=await fetchSpotifyToken();
    syncSpotifyVolume(state.volume);
    if(playing)await spotifyApiPlay(trackId);
  }

  function loadYouTube(id,playing){
    if(!window.YT||!window.YT.Player)throw new Error("YouTube ainda está carregando. Aguarde um instante.");
    if(!state.yt){
      state.yt=new YT.Player("youtube",{
        width:"1",height:"1",videoId:id,
        playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,playsinline:1,rel:0},
        events:{
          onReady:e=>{
            state.ytReady=true;
            e.target.setVolume(state.volume);
            if(state.lastSnapshot?.state?.is_playing)e.target.playVideo();
          },
          onStateChange:e=>{
            if(e.data===0){state.clockRunning=false;finishCurrent();}
            if(e.data===1){
              const d=Number(state.yt.getDuration())*1000||state.clockDuration;
              const c=Number(state.yt.getCurrentTime())*1000||state.clockPosition;
              setClock(c,d,true); updatePlaying(true);
            }
            if(e.data===2){
              const d=Number(state.yt.getDuration())*1000||state.clockDuration;
              const c=Number(state.yt.getCurrentTime())*1000||state.clockPosition;
              setClock(c,d,false); renderProgress(c,d); updatePlaying(false);
            }
          }
        }
      });
    }else{
      state.yt.loadVideoById(id);
      if(playing)state.yt.playVideo();
    }
  }

  async function loadAudio(url,playing,volume){
    if(!state.audio)state.audio=$("audio");
    state.audio.volume=Math.max(0,Math.min(1,Number(volume)/100));
    if(state.audio.src!==url){state.audio.src=url;state.audio.load();}
    if(playing){
      try{await state.audio.play();}
      catch(_){throw new Error("O OBS bloqueou a reprodução automática do áudio.");}
    }
  }

  async function loadCurrent(current,volume,playing){
    const url=current.source_url||"";
    stopOtherMedia(current.provider);
    if(current.provider==="youtube"){
      const id=getYouTubeId(url); if(!id)throw new Error("Link do YouTube inválido.");
      loadYouTube(id,playing);
    }else if(current.provider==="spotify"){
      const id=getSpotifyTrackId(url); if(!id)throw new Error("Faixa do Spotify inválida.");
      await loadSpotify(id,playing);
    }else if(current.provider==="link"){
      if(!/^https?:\/\//i.test(url)||!/\.(mp3|m4a|aac|ogg|wav|opus)(\?.*)?$/i.test(url))
        throw new Error("Link direto de áudio inválido.");
      await loadAudio(url,playing,volume);
    }else{
      throw new Error("Esta fonte não é compatível com o player do OBS. Use YouTube, Spotify ou link direto de áudio.");
    }
    state.currentId=current.id;
    state.provider=current.provider;
    state.audioUrl=url;
    state.playing=!!playing;
    state.lastEndedId=null;
    state.loadError=false;
    state.lastSeekRevision=Number(state.lastSnapshot?.state?.seek_revision||0);
    const p=Number(state.lastSnapshot?.state?.position_ms||0);
    const d=Number(state.lastSnapshot?.state?.duration_ms||0);
    if(d){setClock(p,d,playing);renderProgress(p,d);}
  }

  function stopOtherMedia(provider){
    if(provider!=="youtube"&&state.yt){try{state.yt.stopVideo()}catch(_){}}
    if(provider!=="spotify"&&state.spotifyPlayer){try{state.spotifyPlayer.pause()}catch(_){}}
    if(provider!=="link"&&state.audio){try{state.audio.pause()}catch(_){}}
  }

  async function syncPlaying(playing){
    if(state.provider==="youtube"&&state.yt){
      if(playing)state.yt.playVideo();else state.yt.pauseVideo();
    }
    if(state.provider==="spotify"&&state.spotifyPlayer){
      if(playing){
        if(state.spotifyState?.paused){try{await state.spotifyPlayer.resume()}catch(_){}}
        else if(!state.spotifyState){
          const id=getSpotifyTrackId(state.audioUrl);
          if(id)try{await spotifyApiPlay(id)}catch(_){}
        }
      }else{try{await state.spotifyPlayer.pause()}catch(_){}}
    }
    if(state.provider==="link"&&state.audio){
      if(playing&&!state.audio.src)await loadAudio(state.audioUrl,true,state.volume);
      else if(playing&&state.audio.paused){try{await state.audio.play()}catch(_){}}
      else if(!playing)state.audio.pause();
    }
  }

  function renderProgress(position,duration){
    const p=duration?Math.max(0,Math.min(100,position/duration*100)):0;
    $("bar").style.width=`${p}%`;
    $("elapsed").textContent=fmt(position/1000);
    $("duration").textContent=duration?fmt(duration/1000):"0:00";
  }

  async function updatePlaying(playing){
    state.playing=!!playing;
    try{
      await fetch(`/control/${encodeURIComponent(TOKEN)}/playing`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({is_playing:!!playing}),cache:"no-store"
      });
    }catch(_){}
  }

  async function syncProgress(position,duration){
    const now=Date.now();
    if(state.progressBusy||now-state.lastProgressSent<1500)return;
    state.progressBusy=true;
    state.lastProgressSent=now;
    try{
      await fetch(`/control/${encodeURIComponent(TOKEN)}/progress`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({position_ms:Math.max(0,Math.round(position||0)),duration_ms:Math.max(0,Math.round(duration||0))}),
        cache:"no-store"
      });
    }catch(_){}
    finally{state.progressBusy=false;}
  }

  async function applySeekIfNeeded(snapshot){
    const revision=Number(snapshot.state?.seek_revision||0);
    if(!revision||revision===state.lastSeekRevision)return;
    state.lastSeekRevision=revision;
    const position=Math.max(0,Number(snapshot.state?.seek_position_ms||0));
    try{
      if(state.provider==="spotify"&&state.spotifyPlayer)await state.spotifyPlayer.seek(position);
      else if(state.provider==="youtube"&&state.yt)state.yt.seekTo(position/1000,true);
      else if(state.provider==="link"&&state.audio)state.audio.currentTime=position/1000;
      renderProgress(position,Number(snapshot.state?.duration_ms||0));
      await syncProgress(position,Number(snapshot.state?.duration_ms||0));
    }catch(_){}
  }

  async function finishCurrent(){
    if(state.lastEndedId===state.currentId)return;
    state.lastEndedId=state.currentId;
    try{
      const r=await fetch(`/control/${encodeURIComponent(TOKEN)}/skip`,{method:"POST",cache:"no-store"});
      if(!r.ok)return;
      const d=await r.json().catch(()=>null);
      if(d?.ok)render(d);
    }catch(_){}
  }

  async function heartbeat(){
    try{
      await fetch(`/control/${encodeURIComponent(TOKEN)}/heartbeat`,{
        method:"POST",cache:"no-store",keepalive:true
      });
    }catch(_){}
  }

  async function poll(){
    const r=await fetch(`/status/${encodeURIComponent(TOKEN)}`,{cache:"no-store"});
    if(!r.ok)throw new Error("Conexão OBS inválida.");
    const d=await r.json();
    render(d);
  }

  state.audio=$("audio");
  if(state.audio){
    state.audio.addEventListener("timeupdate",()=>{
      const d=state.audio.duration||0,c=state.audio.currentTime||0;
      setClock(c*1000,d*1000,!state.audio.paused);
      renderProgress(c*1000,d*1000); syncProgress(c*1000,d*1000);
    });
    state.audio.addEventListener("ended",finishCurrent);
    state.audio.addEventListener("play",()=>updatePlaying(true));
    state.audio.addEventListener("pause",()=>updatePlaying(false));
  }

  window.onYouTubeIframeAPIReady=()=>{state.ytReady=true;poll().catch(showError);};
  const spotifyScript=document.createElement("script");
  spotifyScript.src="https://sdk.scdn.co/spotify-player.js";spotifyScript.async=true;spotifyScript.dataset.sn7SpotifySdk="1";document.head.appendChild(spotifyScript);
  const ytScript=document.createElement("script");
  ytScript.src="https://www.youtube.com/iframe_api";ytScript.async=true;document.head.appendChild(ytScript);

  // Relógio visual local: não depende de consultas ao PostgreSQL.
  function animationTick(){
    try{
      if(state.yt&&state.provider==="youtube"){
        const d=Number(state.yt.getDuration())*1000||state.clockDuration;
        const c=Number(state.yt.getCurrentTime())*1000||0;
        if(d>0 && Math.abs(c-state.clockPosition)>1200) setClock(c,d,state.playing);
      }
      tickClock();
    }catch(_){}
    requestAnimationFrame(animationTick);
  }
  requestAnimationFrame(animationTick);

  // O backend sincroniza fila/estado; o relógio acima permanece local e suave.
  setInterval(()=>poll().catch(()=>{}),1200);
  setInterval(()=>pollOverlayEvents().catch(()=>{}),700);
  setInterval(()=>heartbeat(),2000);
  heartbeat();
  poll().catch(showError);
  pollOverlayEvents().catch(()=>{});
})();
</script>
{% endif %}
</body>
</html>
