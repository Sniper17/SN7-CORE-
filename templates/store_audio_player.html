<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>SN7 Core · Player da Loja</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.player{width:100%;height:100%;display:grid;place-items:center}.box{width:min(520px,92vw);padding:22px;border:1px solid rgba(255,255,255,.10);border-radius:20px;background:rgba(9,12,18,.94);box-shadow:0 18px 60px rgba(0,0,0,.35);text-align:center}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(155,140,255,.12);color:#c8c0ff;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.title{margin:10px 0 5px;font-size:19px;font-weight:900}.status{color:#8e98a8;font-size:11px}.name{margin-top:12px;color:#c9c1ff;font-size:12px;font-weight:800}.start{margin-top:15px;border:1px solid rgba(155,140,255,.24);border-radius:10px;padding:10px 14px;background:#7049df;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none}audio{width:100%;margin-top:15px}
</style>
</head>
<body>
<div class="player"><div class="box">
  <span class="badge">SN7 CORE · ÁUDIO DA LOJA</span>
  <div class="title">Player automático da live</div>
  <div class="status" id="status">Aguardando resgates...</div>
  <div class="name" id="name"></div>
  <button class="start" id="start">Iniciar player</button>
  <audio id="audio" class="hidden" controls preload="auto"></audio>
</div></div>
<script>
(function(){
  const bid={{ broadcaster_id|tojson }};
  const token=new URLSearchParams(location.search).get('token')||'';
  const status=document.getElementById('status'),name=document.getElementById('name'),audio=document.getElementById('audio'),start=document.getElementById('start');
  let running=false, current=null, timer=null;
  const api=u=>fetch(u,{credentials:'same-origin'}).then(async r=>{let d={};try{d=await r.json()}catch(_){};if(!r.ok)throw new Error(d.error||'Player indisponível');return d});
  function setStatus(v){status.textContent=v}
  async function finish(id){try{await fetch(`/api/store/${bid}/audio/${id}/complete?token=${encodeURIComponent(token)}`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin'})}catch(_){} current=null;name.textContent='';}
  async function poll(){
    if(!running)return;
    try{
      if(current)return;
      const d=await api(`/api/store/${bid}/audio/next?token=${encodeURIComponent(token)}`);
      if(d.audio){current=d.audio;name.textContent=`🔊 ${d.audio.name} · ${d.audio.viewer_username}`;setStatus('Reproduzindo recompensa...');audio.src=d.audio.audio_url;audio.classList.remove('hidden');try{await audio.play();}catch(_){setStatus('Clique em iniciar para liberar o áudio.');start.classList.remove('hidden');return}}
      else setStatus('Aguardando resgates...');
    }catch(e){setStatus(e.message)}
  }
  audio.addEventListener('ended',async()=>{if(current)await finish(current.id);poll()});
  audio.addEventListener('error',async()=>{if(current)await finish(current.id);setStatus('Não foi possível reproduzir este áudio.');setTimeout(poll,500) });
  start.onclick=async()=>{start.classList.add('hidden');running=true;await poll();timer=setInterval(poll,2500)};
  // Em Browser Sources/OBS, o autoplay normalmente é permitido. Se o navegador bloquear,
  // o botão aparece e uma única interação libera a fila inteira.
  running=true;poll();timer=setInterval(poll,2500);
})();
</script>
</body>
</html>
